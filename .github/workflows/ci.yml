# CI for zedit — Linux + Apple Silicon macOS only (no Windows / no Intel Mac).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            cmake ninja-build g++ pkg-config \
            clang clangd \
            libgl1-mesa-dev \
            libx11-dev libxcursor-dev libxinerama-dev libxrandr-dev libxi-dev \
            libwayland-dev libxkbcommon-dev \
            dpkg-dev \
            xvfb xauth xclip xdotool libgl1-mesa-dri \
            sway wl-clipboard
          # xvfb/xclip: real X11 CLIPBOARD for the [real-clipboard][x11]
          # tests; xdotool + Mesa (llvmpipe) to drive the real ze window in
          # tests/e2e/x11_paste_e2e.sh. sway (headless) + wl-clipboard: a
          # real Wayland clipboard with wlr-data-control for the
          # [real-clipboard][wayland] tests.

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build

      - name: Start headless Wayland compositor (sway)
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg"
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          printf 'xwayland disable\n' > "$RUNNER_TEMP/sway.conf"
          WLR_BACKENDS=headless WLR_RENDERER=pixman WLR_LIBINPUT_NO_DEVICES=1 \
            nohup sway -c "$RUNNER_TEMP/sway.conf" > "$RUNNER_TEMP/sway.log" 2>&1 &
          for _ in $(seq 50); do
            [ -S "$XDG_RUNTIME_DIR/wayland-1" ] && break
            sleep 0.2
          done
          ls -la "$XDG_RUNTIME_DIR"
          test -S "$XDG_RUNTIME_DIR/wayland-1" || { cat "$RUNNER_TEMP/sway.log"; exit 1; }
          # Only the test steps get these (not the build), via env: below.
          echo "ZEDIT_XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"

      - name: Test
        env:
          # Lets the [real-clipboard] cases in tests/frontend/test_linux_clipboard.cpp
          # use the real X11 CLIPBOARD (Xvfb) and Wayland clipboard (sway)
          # instead of skipping.
          ZEDIT_TEST_REAL_CLIPBOARD: "1"
        run: |
          XDG_RUNTIME_DIR="$ZEDIT_XDG_RUNTIME_DIR" WAYLAND_DISPLAY=wayland-1 \
            xvfb-run -a ctest --test-dir build --output-on-failure

      - name: Paste check on the real X11 clipboard (Xvfb)
        env:
          ZEDIT_TEST_REAL_CLIPBOARD: "1"
        run: |
          # Puts HTML-only (and RTF-only, and 4+ MB INCR) data on the real
          # X11 CLIPBOARD with xclip, plus a hung owner, and pastes through
          # the editor exactly as App does. Run on its own so the log shows
          # it ran; Catch2 exits non-zero if every case was skipped.
          xvfb-run -a sh -ec '
            ./build/tests/zedit_tests "[real-clipboard][x11]" --durations yes
            # What an HTML-only copy offers, as any X11 client sees it:
            # TARGETS + text/html, no UTF8_STRING/STRING (all GLFW asks for).
            printf "<ol><li>Run <code>make</code></li></ol>" |
              xclip -selection clipboard -t text/html -i
            echo "CLIPBOARD TARGETS:"; xclip -selection clipboard -o -t TARGETS | tee targets.txt
            ! grep -qx -e UTF8_STRING -e STRING -e "text/plain.*" targets.txt
          '
          # And through the real app: HTML-only copy, then i + Ctrl-V +
          # Escape + Ctrl-S in a running ze window; checks the saved file.
          xvfb-run -a -s "-screen 0 1600x1000x24" \
            tests/e2e/x11_paste_e2e.sh build/frontend_imgui/ze x11-paste-e2e.png

      - name: Upload X11 paste screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-x11-paste-e2e
          path: x11-paste-e2e.png
          if-no-files-found: warn

      - name: Paste check on the real Wayland clipboard (headless sway)
        env:
          ZEDIT_TEST_REAL_CLIPBOARD: "1"
        run: |
          export XDG_RUNTIME_DIR="$ZEDIT_XDG_RUNTIME_DIR" WAYLAND_DISPLAY=wayland-1
          unset DISPLAY
          # Same through wl-paste on a real compositor. HTML-only data comes
          # from tests/helpers/wl_clipboard_owner.cpp, since wl-copy adds
          # text/plain aliases to any text/* type.
          ./build/tests/zedit_tests "[real-clipboard][wayland]" --durations yes
          printf '<ol><li>Run <code>make</code></li></ol>' > "$RUNNER_TEMP/clip.html"
          ./build/tests/zedit_wl_clipboard_owner "text/html=$RUNNER_TEMP/clip.html" > "$RUNNER_TEMP/owner.out" &
          owner=$!
          for _ in $(seq 50); do grep -q ready "$RUNNER_TEMP/owner.out" && break; sleep 0.1; done
          echo "wl-paste --list-types:"; wl-paste --list-types
          kill "$owner"

      - name: Package .deb
        run: |
          cd build
          cpack -G DEB
          ls -la *.deb
          dpkg-deb -f ./*.deb Depends Recommends

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: zedit-linux-amd64-deb
          path: build/*.deb
          if-no-files-found: error

  macos:
    name: macOS (Apple Silicon)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew install cmake ninja
          # OpenGL / Cocoa come with the Xcode CLT on the runner.
          # CPack DragNDrop uses hdiutil (present on macOS runners).
          # Unsigned .dmg is fine — same Gatekeeper story as published releases.

      - name: Configure (arm64)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_OSX_ARCHITECTURES=arm64

      - name: Build
        run: cmake --build build

      - name: Test
        env:
          # Lets the [real-clipboard] case in tests/frontend/test_macos_pasteboard.cpp
          # use the runner's general NSPasteboard instead of skipping.
          ZEDIT_TEST_REAL_CLIPBOARD: "1"
        run: ctest --test-dir build --output-on-failure

      - name: Paste check on the real macOS clipboard
        env:
          ZEDIT_TEST_REAL_CLIPBOARD: "1"
        run: |
          # Puts HTML-only data on the general NSPasteboard and pastes it
          # through the editor exactly as Cmd-V does. Run on its own so the
          # log shows it ran; Catch2 exits non-zero if it was skipped.
          ./build/tests/zedit_tests "[real-clipboard]" --durations yes
          # What the test left on the general pasteboard, as macOS itself
          # sees it: HTML only, no plain-text flavor (which is all GLFW's
          # glfwGetClipboardString() accepts).
          osascript -e 'clipboard info' || true

      - name: Package .dmg
        run: |
          cd build
          cpack -G DragNDrop
          ls -la *.dmg

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: zedit-macos-arm64-dmg
          path: build/*.dmg
          if-no-files-found: error
