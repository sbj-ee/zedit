# CI for zedit — Linux + Apple Silicon macOS only (no Windows / no Intel Mac).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            cmake ninja-build g++ pkg-config \
            libgl1-mesa-dev \
            libx11-dev libxcursor-dev libxinerama-dev libxrandr-dev libxi-dev \
            libwayland-dev libxkbcommon-dev \
            dpkg-dev

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package .deb
        run: |
          cd build
          cpack -G DEB
          ls -la *.deb

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: zedit-linux-amd64-deb
          path: build/*.deb
          if-no-files-found: error

  macos:
    name: macOS (Apple Silicon)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew install cmake ninja
          # OpenGL / Cocoa come with the Xcode CLT on the runner.

      - name: Configure (arm64)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_OSX_ARCHITECTURES=arm64

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
